<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Kilencedik feladat</title>
</head>
<body>

    <h1>Kilencedik feladat</h1>
    <h3>Aktuális dátum szövegként és számként</h3>

    <script>
        var most = new Date();
        document.write("<h4>A mai dátum megjelenítése STRING-ként: </h4>" + String(most) + "<br/><h4>A mai dátum megjelenítése SZÁM-ként: </h4>" + Number(most));
    </script>

</body>
</html>
