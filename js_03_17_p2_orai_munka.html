<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>2. Feladat: Minden harmadik szám, köb, kerekített gyök</title>
    <style>
        table {
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px 12px;
            text-align: right;
        }
        th {
            background-color: #f2f2f2;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Minden harmadik szám, köbe és kerekített négyzetgyöke</h2>
    <table>
        <thead>
            <tr>
                <th>Szám</th>
                <th>Köbe</th>
                <th>Négyzetgyöke (kerekítve)</th>
            </tr>
        </thead>
        <tbody id="harmadikTablazat">
        </tbody>
    </table>

    <script>
        var tbody = document.getElementById("harmadikTablazat");

        for (var i = 3; i <= 100; i += 3) {
            
            var kob = Math.pow(i, 3);
            var gyok = Math.sqrt(i);
            
            var kerekitettGyok = Math.round(gyok * 100) / 100;

            var sor = document.createElement("tr");
            sor.innerHTML = "<td>" + i + "</td>" +
                            "<td>" + kob + "</td>" +
                            "<td>" + kerekitettGyok + "</td>";
            
            tbody.appendChild(sor);
        }
    </script>

</body>
</html>
