<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Tizenegyedik feladat</title>
</head>
<body>

    <h1>11. feladat – String() és search()</h1>


    <button onclick="vizsgalat()">Vizsgálat</button>

    <script language="JavaScript">
        function vizsgalat() {

            var szoveg = new String("Internet technológiák");
            

            if (szoveg.search("I")==-1)
                alert("nem szerepel 'I' benne"); 
            else 
                alert("szerepel, és indexe: " + szoveg.search('I'));
        }
    </script>

</body>
</html>
