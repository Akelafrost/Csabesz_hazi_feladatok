<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Saját objektum létrehozása és ciklus használata</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            font-size: 18px;
            line-height: 1.4;
            color: #000;
            padding: 20px;
        }
        h2 {
            font-size: 22px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <h2>Saját objektum létrehozása és ciklus használata</h2>
    
    <div id="ide1"></div>
    <br>
    <div id="ide2"></div>

    <script>
        var hallgato = {
            veznev: "Kovács", 
            kernev: "Pál", 
            szak: "Mérnök Informatikus", 
            kora: 21, 
            vizsganap: "2016.01.10"
        };
        document.getElementById("ide1").innerHTML = "A " +
        hallgato.veznev + " " + hallgato.kernev + " szakja: " +
        hallgato.szak;
        var adatok = "";
        for (var i in hallgato) {
            adatok += hallgato[i] + " <br>";
        }
        document.getElementById("ide2").innerHTML = adatok;
    </script>

</body>
</html>
