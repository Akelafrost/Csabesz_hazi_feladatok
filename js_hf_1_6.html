<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Hatodik feladat</title>
</head>
<body>

    <h1>Hatodik feladat</h1>

    <script language="JavaScript">
        var karakterek = new Array("0.01", "25,52", "100", "telefonszám", "670-0010001");
        document.write("<h3>A <u>parseInt()</u> függvény alkalmazása:</h3>");
        for(i=0; i<karakterek.length; ++i)
        {
            document.write(karakterek[i] + " = <b>" + parseInt(karakterek[i]) + "</b><br>");
        }
    </script>

</body>
</html>
