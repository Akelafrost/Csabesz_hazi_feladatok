<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>6. Feladat - Rendezés az előző alapján</title>
</head>
<body>

    <script language="JavaScript">

        var tomb = new Array(5);
        for (var i = 0; i <= 4; i++) 
        {
            tomb[i] = new Array(2);
            tomb[i][0] = window.prompt("Írja be a(z) " + (i + 1) + ". nevet!", "Kis Edina");
            tomb[i][1] = window.prompt("Írja be a(z) " + (i + 1) + ". életkort!", "20");
        };


        function tabla(sor, oszlop, ertek) 
        {
            document.write("<table cellspacing=0 cellpadding=10 border=1><tr><th>Név</th><th>Életkor</th></tr>");
            for (var i = 0; i < sor; i++) 
            {
                document.write("<tr>");
                for (var j = 0; j < oszlop; j++) 
                {
                    document.write("<td>" + ertek[i][j] + "</td>");
                };
                document.write("</tr>");
            };
            document.write("</table>");
        };


        tabla(5, 2, tomb);

        function osszegzes() 
        {
            var osszeg = 0;
            for (var i = 0; i <= 4; i++) 
            {
                osszeg = osszeg + parseInt(tomb[i][1]);
            }
            document.getElementById("korok").innerHTML = "Az életkorok összege: " + osszeg + "év";
        };

  
        function maximum(tomb)
        {
            var max, maxi;
            max = tomb[0][1];
            maxi = 0;
            for (i=1; i<5; i++)
                if(parseInt(tomb[i][1])>parseInt(max))
                {
                    max = tomb[i][1];
                    maxi = i;
                };
            document.getElementById("maxev").innerHTML = "A legidősebb hallgató neve: " +tomb[maxi][0]+"<br/>Életkora: "+max;
        };

        function rendez(tomb)
        {
            var rend;
            for (i=0; i<5; i++)
            {
                for (j=i+1; j<5; j++)
                {
                    if(parseInt(tomb[i][1]) > parseInt(tomb[j][1]))
                    {
                        rend = tomb[i];
                        tomb[i] = tomb[j];
                        tomb[j] = rend;
                    };
                };
            };
            x = document.getElementById("rendez");
            for (i=0; i<5; i++)
            {
                x.innerHTML += "<br/>" + tomb[i][0] + " " + tomb[i][1];
            };
        };
    </script>

    <br/>
    <button onclick="osszegzes()">Korok összeg</button>
    <h4 id="korok"></h4>

    <button onclick="maximum(tomb)">Legidősebb hallgató</button>
    <h4 id="maxev"></h4>


    <button onclick="rendez(tomb)">Rendezett lista</button>
    <h4 id="rendez"></h4>

</body>
</html>
