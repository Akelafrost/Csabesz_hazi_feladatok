<!DOCTYPE html>
<html>
<body>
    <h1>A HTML dokumentum egy tulajdonságának megváltoztatása</h1>
    <h3>Színváltoztatása</h3>
    <form>
        <input type="button" value="  Színváltás  " onclick="valt()">
    </form>

    <script>
        function valt(){
            if (document.fgColor == "#0000ff") {
                document.fgColor = "#ff0000";
            }
            else if (document.fgColor == "#00ff00") {
                document.fgColor = "#0000ff";
            }
            else {
                document.fgColor = "#00ff00";
            }
        }
    </script>
</body>
</html>
